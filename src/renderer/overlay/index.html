<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedtime Lockout</title>
    <link rel="stylesheet" href="./theme-drift.css" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body data-theme="drift">
    <div id="overlay-root" class="overlay">
      <header class="topbar">
        <div class="topbar-left">
          <span class="moon-glyph" aria-hidden="true">&#9789;</span>
          <span class="app-name">Bedtime Lockout</span>
        </div>
        <div class="topbar-right">
          <span id="clock" class="clock mono"></span>
        </div>
      </header>

      <main class="stage">
        <div id="orb" class="orb" aria-hidden="true">
          <div class="orb-glow"></div>
          <div class="orb-stars orb-stars-a"></div>
          <div class="orb-stars orb-stars-b"></div>
        </div>

        <div id="status-line" class="status-line mono"></div>

        <div id="reentry-chip" class="chip mono" hidden></div>

        <p id="prose" class="prose"></p>

        <div id="transcript" class="transcript" hidden></div>

        <div id="thinking" class="thinking" hidden>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </div>

        <div id="gatekeeper-down" class="gatekeeper-down" hidden>
          <p id="gatekeeper-down-title"></p>
          <p id="gatekeeper-down-hint" class="mono dim"></p>
        </div>

        <form id="input-form" class="input-pill">
          <input
            id="input-text"
            type="text"
            autocomplete="off"
            placeholder="What are you still working on?"
          />
          <button id="input-send" type="submit" aria-label="Send" class="send-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>

        <div id="override-hint" class="hint mono dim"></div>

        <form id="override-form" class="override-pill">
          <input
            id="override-text"
            type="text"
            autocomplete="off"
            class="mono"
            placeholder="override phrase"
          />
          <button id="override-send" type="submit" class="override-send-btn">Pass</button>
        </form>

        <button id="sleep-btn" type="button" class="sleep-btn">Lock the Mac</button>

        <div id="override-footer" class="override-footer mono dim" hidden></div>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
